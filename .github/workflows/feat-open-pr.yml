name: "[FEAT] Validate & open PR to main"

# GitHub Flow: validates every feature/**/hotfix/** push, then - only if that
# passes - auto-opens (or leaves alone, if one is already open; new commits
# show up on it automatically) the PR to main. The "build" job below also
# satisfies main's required status check for that PR, since branch
# protection matches checks by commit SHA regardless of which workflow/event
# produced them - a real git push (unlike a bot-created PR) isn't subject to
# GitHub's "GITHUB_TOKEN won't trigger new workflow runs" recursion guard, so
# this runs immediately without needing manual approval.
on:
  push:
    branches:
      - "feature/**"
      - "hotfix/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check extension version was bumped
        run: |
          git fetch origin main
          if git diff --quiet origin/main...HEAD -- extension/; then
            echo "No extension/ changes - skipping version check."
          else
            git show origin/main:extension/package.json > /tmp/main-package.json
            OLD_VERSION=$(node -p "require('/tmp/main-package.json').version")
            NEW_VERSION=$(node -p "require('./extension/package.json').version")
            if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
              echo "::error::extension/ changed but extension/package.json's version ($NEW_VERSION) wasn't bumped. Bump it (patch/minor/major) before this can be merged."
              exit 1
            fi
            echo "Version bump OK: $OLD_VERSION -> $NEW_VERSION"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w extension

      - name: Build extension
        run: npm run build -w extension

      - name: Build site
        run: npm run build -w site

  open-pr:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open or update PR to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          COUNT=$(gh pr list --base main --head "$BRANCH" --json number --jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "$BRANCH" \
              --body "Auto-opened by the [FEAT] workflow after \`$BRANCH\` passed validation."
          else
            echo "A PR from $BRANCH to main is already open - nothing to do, new commits show up on it automatically."
          fi
