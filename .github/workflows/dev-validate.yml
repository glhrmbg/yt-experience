name: "[DEV] Validate"

# Required status check gating merges into main. Mirrors feat-validate.yml but
# scoped to PRs targeting main (i.e. the develop -> main promotion, and any
# hotfix/* -> main PR).
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w extension

      - name: Build
        run: npm run build -w extension
