name: "[FEAT] Validate"

# Required status check gating merges into develop. Deliberately unfiltered by
# source branch name/path (unlike the push-triggered workflow below) so it
# always runs for any PR targeting develop, regardless of what the source
# branch is called - branch protection requires this "build" check to exist.
on:
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w extension

      - name: Build
        run: npm run build -w extension
