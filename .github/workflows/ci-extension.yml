name: CI extension

on:
  push:
    branches: [main, develop]
    paths:
      - "extension/**"
      - ".github/workflows/ci-extension.yml"
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w extension

      - name: Build
        run: npm run build -w extension
