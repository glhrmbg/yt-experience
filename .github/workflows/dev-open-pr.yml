name: "[DEV] Validate & open PR to main"

# Fires after a feature PR lands on develop (push to develop, e.g. a merge).
# Re-validates the merged state and, only if that passes, auto-opens (or
# leaves alone) the release PR to main. The "build" job is also what
# satisfies main's required status check for that PR (see feat-open-pr.yml
# for why this works without a separate pull_request-triggered workflow).
on:
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w extension

      - name: Build
        run: npm run build -w extension

  open-pr:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open or update PR to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh pr list --base main --head develop --json number --jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            gh pr create --base main --head develop \
              --title "Release: develop -> main" \
              --body "Auto-opened by the [DEV] workflow after \`develop\` passed validation."
          else
            echo "A PR from develop to main is already open - nothing to do, new commits show up on it automatically."
          fi
