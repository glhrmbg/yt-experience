name: "[PROD] Release extension"

# Packages a fresh build of the extension and publishes it as a GitHub
# Release with a downloadable zip, every time a change to extension/** lands
# on main. No store account/credentials involved - users download the zip,
# unzip it, and load it unpacked (Developer mode -> Load unpacked).
#
# Versioning: auto-increments PATCH from the latest v*.*.* tag (v0.1.0 ->
# v0.1.1 -> ...), no manual bump needed. If nobody has bumped
# extension/package.json's version between releases, that's fine - this is
# the only source of truth for release versions. To cut a MINOR or MAJOR
# release on purpose, bump extension/package.json's version yourself in a
# PR; the next auto-release will pick up from that new baseline instead.
on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/prod-release-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute next version
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          if [ -z "$LATEST_TAG" ]; then
            VERSION=$(node -p "require('./extension/package.json').version")
          else
            BASE="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set extension version
        run: npm pkg set version="${{ steps.version.outputs.version }}" -w extension

      - name: Build extension
        run: npm run build -w extension

      - name: Zip extension build
        run: |
          cd extension/dist
          zip -r ../../yt-experience-extension.zip .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          SHA_SHORT=$(git rev-parse --short HEAD)
          ZIP_NAME="YTXP-v${VERSION}.zip"
          mv yt-experience-extension.zip "$ZIP_NAME"

          printf '%s\n' \
            "Build automático da extensão **YT Experience (YTXP)**, a partir do commit \`$SHA_SHORT\`." \
            "" \
            "> Baixe o arquivo \`$ZIP_NAME\` abaixo. Ignore o \"Source code (zip)\"/\"(tar.gz)\" que o GitHub adiciona automaticamente - eles contêm o repositório inteiro (extensão + site), não a extensão pronta pra instalar." \
            "" \
            "### Como instalar" \
            "1. Baixe \`$ZIP_NAME\` e descompacte em uma pasta." \
            "2. Abra \`brave://extensions\` (ou \`chrome://extensions\`) no navegador." \
            "3. Ative o **Modo do desenvolvedor** (canto superior direito)." \
            "4. Clique em **Carregar sem compactação** e selecione a pasta descompactada." \
            > release-notes.md

          gh release create "$TAG" \
            "$ZIP_NAME" \
            --title "YT Experience (YTXP) v$VERSION" \
            --notes-file release-notes.md
