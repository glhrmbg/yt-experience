name: "[PROD] Release extension"

# Packages a fresh build of the extension and publishes it as a GitHub
# Release with a downloadable zip, every time a change to extension/** lands
# on main. No store account/credentials involved - users download the zip,
# unzip it, and load it unpacked (Developer mode -> Load unpacked).
#
# Versioning: extension/package.json's version is the single source of
# truth, tagged/titled as ytxp@X.Y.Z. feat-open-pr.yml's "build" job blocks
# any PR that touches extension/** without bumping that version, so this
# workflow can trust it's always release-worthy - no auto-increment logic
# needed here.
on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/prod-release-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build -w extension

      - name: Zip extension build
        run: |
          cd extension/dist
          zip -r ../../yt-experience-extension.zip .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./extension/package.json').version")
          TAG="ytxp@$VERSION"
          SHA_SHORT=$(git rev-parse --short HEAD)
          ZIP_NAME="YTXP-v${VERSION}.zip"
          mv yt-experience-extension.zip "$ZIP_NAME"

          printf '%s\n' \
            "Build automático da extensão **YT Experience (YTXP)**, a partir do commit \`$SHA_SHORT\`." \
            "" \
            "> Baixe o arquivo \`$ZIP_NAME\` abaixo. Ignore o \"Source code (zip)\"/\"(tar.gz)\" que o GitHub adiciona automaticamente - eles contêm o repositório inteiro (extensão + site), não a extensão pronta pra instalar." \
            "" \
            "### Como instalar" \
            "1. Baixe \`$ZIP_NAME\` e descompacte em uma pasta." \
            "2. Abra \`brave://extensions\` (ou \`chrome://extensions\`) no navegador." \
            "3. Ative o **Modo do desenvolvedor** (canto superior direito)." \
            "4. Clique em **Carregar sem compactação** e selecione a pasta descompactada." \
            > release-notes.md

          gh release create "$TAG" \
            "$ZIP_NAME" \
            --title "$TAG" \
            --notes-file release-notes.md
