name: "[PROD] Release extension"

# Packages a fresh build of the extension and publishes it as a GitHub
# Release with a downloadable zip, every time a change to extension/** lands
# on main. No store account/credentials involved - users download the zip,
# unzip it, and load it unpacked (Developer mode -> Load unpacked).
#
# Versioning: extension/package.json's version is the single source of
# truth, tagged/titled as ytxp@X.Y.Z. feat-open-pr.yml's "build" job blocks
# any PR that touches extension/** without bumping that version, so this
# workflow can trust it's always release-worthy - no auto-increment logic
# needed here.
#
# Triggering on changes to this file too means editing the release notes
# template (no version bump) re-runs it against a tag that already has a
# release - create-or-update instead of a hard create so that doesn't fail.
on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/prod-release-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build -w extension

      - name: Zip extension build
        run: |
          cd extension/dist
          zip -r ../../yt-experience-extension.zip .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./extension/package.json').version")
          TAG="ytxp@$VERSION"
          SHA_SHORT=$(git rev-parse --short HEAD)
          ZIP_NAME="YTXP-v${VERSION}.zip"
          mv yt-experience-extension.zip "$ZIP_NAME"

          printf '%s\n' \
            "Automated build of the **YT Experience (YTXP)** extension, from commit \`$SHA_SHORT\`." \
            "" \
            "> Download the \`$ZIP_NAME\` file below. Ignore the \"Source code (zip)\"/\"(tar.gz)\" that GitHub adds automatically - those contain the whole repository (extension + site), not the ready-to-install extension." \
            "" \
            "### How to install" \
            "1. Download \`$ZIP_NAME\` and unzip it into a folder." \
            "2. Open \`brave://extensions\` (or \`chrome://extensions\`) in your browser." \
            "3. Enable **Developer mode** (top right corner)." \
            "4. Click **Load unpacked** and select the unzipped folder." \
            > release-notes.md

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" "$ZIP_NAME" --clobber
          else
            gh release create "$TAG" \
              "$ZIP_NAME" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
